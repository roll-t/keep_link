org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.enableUnitTestConfiguration=false

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# mobile_scanner: dùng model quét QR/barcode "unbundled" — tải qua Google Play
# Services lúc cần thay vì nhúng cứng vào app, giảm ~4.8MB/kiến trúc CPU khỏi
# app. Cần máy có Google Play Services (hầu hết máy Android thật đều có).
dev.steenbakker.mobile_scanner.useUnbundled=true
