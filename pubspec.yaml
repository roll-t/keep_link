name: keep_link
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  flutter_svg: ^2.2.3
  get: ^4.7.3
  flutter_widget_from_html: ^0.17.1
  get_storage: ^2.1.1
  flutter_localization: ^0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true
  assets:
    - assets/splash/splash.png

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#ffffff"
  image: assets/splash/splash.png
  
  android_gravity: center 
  
  android_12:
    image: assets/splash/splash.png
    color: "#ffffff"
